<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PitchPerfect - Registro Pós-Jogo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#8bd6b6",
                        "on-primary-fixed-variant": "#00513b",
                        "primary": "#004532",
                        "surface-dim": "#cbdbf5",
                        "surface-tint": "#1b6b51",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-high": "#dce9ff",
                        "surface-variant": "#d3e4fe",
                        "secondary-container": "#d5e0f8",
                        "secondary": "#545f73",
                        "on-surface-variant": "#3f4944",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d8e3fb",
                        "on-primary-container": "#8bd6b7",
                        "outline": "#6f7973",
                        "on-background": "#0b1c30",
                        "tertiary-fixed-dim": "#ffb3ac",
                        "on-tertiary-fixed": "#3b0908",
                        "tertiary-fixed": "#ffdad6",
                        "on-tertiary-fixed-variant": "#73332f",
                        "on-secondary-container": "#586377",
                        "outline-variant": "#bec9c2",
                        "secondary-fixed-dim": "#bcc7de",
                        "on-secondary-fixed": "#111c2d",
                        "background": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "surface": "#f8f9ff",
                        "on-primary-fixed": "#002116",
                        "surface-container-low": "#eff4ff",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#a6f2d1",
                        "on-error": "#ffffff",
                        "tertiary": "#652925",
                        "primary-container": "#065f46",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#8bd6b6",
                        "on-tertiary-container": "#ffb4ad",
                        "surface-container-highest": "#d3e4fe",
                        "on-secondary-fixed-variant": "#3c475a",
                        "tertiary-container": "#823f3a",
                        "inverse-surface": "#213145",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-surface": "#0b1c30"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "40px",
                        "md": "16px",
                        "base": "4px",
                        "sm": "8px",
                        "xs": "4px",
                        "gutter": "24px",
                        "lg": "24px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen pb-[80px]">
<!-- TopAppBar -->
<header class="bg-background dark:bg-on-background w-full top-0 sticky border-b border-outline-variant dark:border-outline z-30">
<div class="flex justify-between items-center px-4 py-4 max-w-container-max mx-auto">
<button class="text-secondary dark:text-secondary-fixed-dim hover:text-primary-container dark:hover:text-primary-fixed-variant transition-colors cursor-pointer active:opacity-80">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed">Registro de Partida</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="px-md py-lg max-w-lg mx-auto">
<!-- Placar Section -->
<section class="mb-xl bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm">
<h2 class="font-label-md text-label-md text-secondary uppercase tracking-wider mb-sm">Placar Final</h2>
<div class="flex items-center justify-between bg-surface-container-low rounded-lg p-md"><div class="flex flex-col items-center flex-1">
<span class="font-label-md text-label-md text-secondary mb-xs">Time A</span>
<div class="flex items-center gap-sm">
<input class="w-20 h-20 text-center font-display text-display text-primary bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary" type="number" value="3" pattern="[0-9]*" inputmode="numeric">
</div>
</div>
<div class="font-headline-md text-headline-md text-secondary px-4">X</div>
<div class="flex flex-col items-center flex-1">
<span class="font-label-md text-label-md text-secondary mb-xs">Time B</span>
<div class="flex items-center gap-sm">
<input class="w-20 h-20 text-center font-display text-display text-primary bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary" type="number" value="2" pattern="[0-9]*" inputmode="numeric">
</div>
</div></div>
</section>
<!-- Presença Section -->
<section class="mb-xl">
<h2 class="font-label-md text-label-md text-secondary uppercase tracking-wider mb-sm">Lista de Presença</h2>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-sm divide-y">
<!-- Player Row -->
<div class="flex items-center justify-between border-b border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors py-3 px-4">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-secondary" data-icon="person">person</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface font-semibold">Carlos Silva</p>
<span class="inline-block px-2 py-0.5 rounded-full bg-primary-container text-on-primary-container text-[10px] font-semibold">Mensalista</span>
</div>
</div>
<label class="flex items-center cursor-pointer">
<input checked="" class="form-checkbox h-6 w-6 text-primary rounded border-outline-variant focus:ring-primary" type="checkbox">
</label>
</div>
<!-- Player Row -->
<div class="flex items-center justify-between border-b border-outline-variant bg-surface-bright hover:bg-surface-container-low transition-colors py-3 px-4">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A small square profile picture of a young male soccer player with short dark hair, wearing a generic athletic jersey. Bright, high-key lighting against a solid light gray background. Professional sports headshot style, clean and focused." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBTFxMYOpoljfF7FIGwyjwaPu3MH1bWACdiPn8lqCAF95IIiMJ-XopFstUy9gDbFlIqrVxmaA9u7r4mWb_ZNUTaV4dTYHE2UgcZ6b4T8OyqSGc19V0zVV1eLA8EXvtwmVLLI4fcm44ybqloMyG9xQC8SWRCkk0bObZAgDIUToZY2HkdIDPBPPzuRT_59qVtN4OqRm7cFSC3MXY8oXfc6K9mkEuJ_6LmxiJMDjlxULW9Ra5XytCS-FxmZw">
</div>
<div>
<p class="font-body-md text-body-md text-on-surface font-semibold">João Pedro</p>
<span class="inline-block px-2 py-0.5 rounded-full bg-surface-dim text-on-surface-variant text-[10px] font-semibold">Avulso</span>
</div>
</div>
<label class="flex items-center cursor-pointer">
<input checked="" class="form-checkbox h-6 w-6 text-primary rounded border-outline-variant focus:ring-primary" type="checkbox">
</label>
</div>
<!-- Player Row - Absent -->
<div class="flex items-center justify-between border-b border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors opacity-60 py-3 px-4">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-secondary" data-icon="person">person</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface font-semibold">Marcos Antonio</p>
<span class="inline-block px-2 py-0.5 rounded-full bg-primary-container text-on-primary-container text-[10px] font-semibold">Mensalista</span>
</div>
</div>
<label class="flex items-center cursor-pointer">
<input class="form-checkbox h-6 w-6 text-primary rounded border-outline-variant focus:ring-primary" type="checkbox">
</label>
</div>
</div>
</section>
<!-- Craque Section -->
<section class="mb-xl">
<h2 class="font-label-md text-label-md text-secondary uppercase tracking-wider mb-sm">Craque do Dia</h2>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-4 pr-10 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary appearance-none shadow-sm">
<option disabled="" selected="" value="">Selecione o jogador...</option>
<option value="1">Carlos Silva</option>
<option value="2">João Pedro</option>
<option value="3">Marcos Antonio</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-secondary">
<span class="material-symbols-outlined" data-icon="star">star</span>
</div>
</div>
</section>
<!-- Observações Section -->
<section class="mb-xl">
<h2 class="font-label-md text-label-md text-secondary uppercase tracking-wider mb-sm">Observações</h2>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-md font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary shadow-sm resize-none" placeholder="Anotações sobre a partida, incidentes, etc..." rows="2"></textarea>
</section>
<!-- Actions -->
<div class="pt-md">
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary font-headline-md text-headline-md py-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-sm active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                Concluir Partida
            </button>
</div>
</main>


</body></html>
