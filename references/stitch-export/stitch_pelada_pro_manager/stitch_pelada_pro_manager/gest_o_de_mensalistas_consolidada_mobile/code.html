<script>
        // Simple filtering logic
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Update active state
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const filter = e.target.getAttribute('data-filter');
                const cards = document.querySelectorAll('.player-card');

                cards.forEach(card => {
                    if (filter === 'all' || card.getAttribute('data-status') === filter) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        // Simple payment confirmation simulation
        document.querySelectorAll('.pay-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const card = this.closest('.player-card');
                
                // Visual feedback
                this.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">refresh</span>';
                
                setTimeout(() => {
                    card.setAttribute('data-status', 'paid');
                    card.classList.remove('border-l-4', 'border-l-error', 'border-y', 'border-r');
                    card.classList.add('border', 'opacity-60');
                    
                    const nameContainer = card.querySelector('.flex-col, div > div'); // Rough targeting
                    if(nameContainer) {
                        const statusContainer = nameContainer.querySelector('.flex.items-center.mt-0\\.5, .flex.items-center.mt-1');
                        if(statusContainer) {
                            statusContainer.innerHTML = `
                                <span class="font-label-sm text-label-sm text-primary bg-primary-container/20 px-2 py-0.5 rounded-full inline-block uppercase">Pago agora</span>
                            `;
                        }
                    }

                    // Replace button with check icon
                    const btnParent = this.parentNode;
                    const checkDiv = document.createElement('div');
                    checkDiv.className = 'text-primary w-8 h-8 flex items-center justify-center';
                    checkDiv.innerHTML = '<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
                    
                    btnParent.replaceChild(checkDiv, this);
                    
                    // Re-apply current filter
                    const activeFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');
                    if (activeFilter !== 'all' && activeFilter !== 'paid') {
                        setTimeout(() => { card.style.display = 'none'; }, 500);
                    }

                }, 600);
            });
        });
    </script>
